# ─────────────────────────────────────────────────────────────────────────────
# Brand identity — the ONE place names live. Edit here (or override per install, see below); no Java change.
#
#   Tihems            = the group (a company active in many niches, not only technology)
#   Tihems Software   = the software department of Tihems; owner/vendor of this product
#   product           = what the customer installs
#
# All three share the same logo and icon (see /brand/*.png, rebuilt by tools/build_brand_assets.py).
# An individual installation can override any key by creating  <data folder>/brand-override.properties
# (same keys) — useful for white-labelling or a reseller — without rebuilding the app.
# File is UTF-8.
# ─────────────────────────────────────────────────────────────────────────────
group.name=Tihems
department.name=Tihems Software
legal.holder=Tihems Software

# Product name. "KaziFlow" is the interim product name; rename here when the final name is decided.
product.name=KaziFlow
product.fullName=KaziFlow ERP
product.tagline=Offline-first ERP for Kenyan SMEs

# TO CONFIRM: these still point at the previous KaziFlow addresses. Replace with the Tihems Software ones.
support.email=support@kaziflow.co.ke
website=kaziflow.co.ke
